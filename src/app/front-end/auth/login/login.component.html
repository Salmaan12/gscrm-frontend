<div class="container-fluid p-0">
  <div class="row">
    <div class="col-12">
      <div class="login-card">
        <div>
          <div>
            <a class="logo" routerLink='/'>
              <!-- <img class="img-fluid for-light" src="assets/images/logo.png" alt="looginpage">
              <img class="img-fluid for-dark" src="assets/images/logo_white.png" alt="looginpage"> -->
              <h3>KW Gold & Silver <br /> Accounting System</h3>
            </a>
          </div>
          <div class="login-main">
            <form class="theme-form" [formGroup]="loginForm" (submit)="login()">
              <!-- <h4>Sign in to KW Gold & Silver</h4> -->
              <p>Enter your username & password to login</p>
              <div class="form-group">
                <label class="col-form-label">Username<sup class="astrik">*</sup></label>
                <input class="form-control" type="text" required="" placeholder="admin" formControlName="username">
              </div>
              <div class="form-group">
                <label class="col-form-label">Password<sup class="astrik">*</sup></label>
                <input class="form-control" [type]="show ? 'text' : 'password'" formControlName="password" required="" placeholder="Password">
                <div class="show-hide" (click)="showPassword()" *ngIf="!show"><span class="show"></span></div>
                <div class="show-hide" (click)="showPassword()" *ngIf="show"><span class="Hide"></span></div>
              </div>
              <div class="form-group mb-0">
                <a class="link" style="top: 45px !important; cursor: pointer;" (click)="openForgetPassModal()" >Forgot password?</a>
                <button class="btn btn-primary btn-block" type="submit"><span>Login</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
