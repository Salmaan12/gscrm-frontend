<div class="container">
  <div class="row">
    <div class="col-md-12 p-0">
      <div class="card m-0 ">
        <div class="card-header">
          <div class="row">
            <div class="col-9">
              <h5>Forgot Password</h5>
            </div>
            <div class="col-3 text-end">
              <button type="button" class="close" aria-label="Close" (click)="closeModal()">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div *ngIf="step === 1">
            <div>
              <div style="display: flex; flex-direction: row; align-items: center; padding: 15px 20%;">
                <div style="height: 18px; width: 20px; border-radius: 10px; background-color: grey;"></div>
                <div style="height: 2px; width: 100%;  background-color: rgb(223, 210, 210);"></div>
                <div style="height: 18px; width: 20px; border-radius: 10px; background-color: rgb(223, 210, 210);"></div>
              </div>
            </div>
            <div
              style="display: flex; flex-direction: row; justify-content: space-between;  padding-left: 10%; padding-right: 14%; margin-bottom: 20px;">
              <div class="label-wizard">
                user verification
              </div>
              <div class="label-wizard">
                new password
              </div>
            </div>
            <div class="form-group">
              <label for="username">User name<sup class="astrik">*</sup></label>
              <input type="text" name="username" [(ngModel)]="username" class="form-control"
                placeholder="Enter Username OR Email" />
            </div>
            <button class="btn btn-primary pull-right" type="submit" (click)="verifyUser()">
              Send Email
            </button>
          </div>
          <div *ngIf="step === 2">
            <div>
              <div style="display: flex; flex-direction: row; align-items: center; padding: 15px 20%;">
                <div style="height: 18px; width: 20px; border-radius: 10px; background-color: green;"></div>
                <div style="height: 2px; width: 100%;  background-color: green;"></div>
                <div style="height: 18px; width: 20px; border-radius: 10px; background-color: green;"></div>
              </div>
            </div>
            <div
              style="display: flex; flex-direction: row; justify-content: space-between;  padding-left: 10%; padding-right: 10%; margin-bottom: 20px;">
              <div class="label-wizard">
                user verification
              </div>
              <div class="label-wizard">
                new password
              </div>
            </div>
            <div class="form-group">
              <label for="username">User name<sup class="astrik">*</sup></label>
              <input type="text" name="username" [(ngModel)]="username" class="form-control" disabled />
            </div>
            <div class="form-group">
              <label for="code">Code<sup class="astrik">*</sup></label>
              <input type="text" name="code" [(ngModel)]="code" class="form-control" placeholder="Enter OTP Code" />
            </div>
            <div class="form-group">
              <label class="col-form-label">Enter New Password<sup class="astrik">*</sup></label>
              <input class="form-control" [type]="showPasswordInput ? 'text' : 'password'" [(ngModel)]="password"
                required="" placeholder="Password" />
              <div class="show-hide-forgot" (click)="toggleShowPassword()">
                <span>{{ showPasswordInput ? "Hide" : "Show" }}</span>
              </div>
            </div>
            <div class="form-group">
              <label class="col-form-label">Confirm New Password<sup class="astrik">*</sup></label>
              <input class="form-control" [type]="showConfirmPasswordInput ? 'text' : 'password'"
                [(ngModel)]="confirmPassword" required="" placeholder="Confirm Password" />
              <div class="show-hide-forgot" (click)="toggleShowConfirmPassword()">
                <span>{{ showConfirmPasswordInput ? "Hide" : "Show" }}</span>
              </div>
            </div>
            <button class="btn btn-success pull-right" type="button" (click)="newPassword()">
              Finish
            </button>


          </div>
        </div>
      </div>
    </div>
  </div>
</div>
