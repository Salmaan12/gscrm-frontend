<div class="container-fluid">
  <div class="row">
    <div class="col-md-12">
      <div class="card mt-2">
        <div class="card-header">
          <div class="row align-items-center">
            <div class="col-md-6">
              <h5>Users</h5>
            </div>
            <div class="col-md-6 text-right">
              <button *ngIf="canEdit" class="btn btn-primary" (click)="addNewUserFunction()">
                Add New User
              </button>
            </div>
          </div>
        </div>
        <div>
          <ngx-ui-loader [loaderId]="'loader-02'" fgsType="folding-cube"></ngx-ui-loader>

          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th scope="col">S.No</th>
                  <th scope="col">User Name</th>
                  <th scope="col">First Name</th>
                  <th scope="col">Last Name</th>
                  <th scope="col">Full Name</th>
                  <th scope="col">Date of Birth</th>
                  <th scope="col">Email</th>
                  <th scope="col">Status</th>
                  <th *ngIf="canEdit" scope="col" style="text-align: center">
                    Action
                  </th>
                </tr>
              </thead>
              <tbody *ngIf="usersList.length > 0">
                <tr *ngFor="let item of usersList; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ item?.userName }}</td>
                  <td>{{item.firstName}}</td>
                  <td>{{item.lastName}}</td>
                  <td>{{ item?.fullName }}</td>
                  <td>{{item.dateOfBirth}}</td>
                  <td>{{ item?.email }}</td>
                  <td>
                    <!-- {{ item?.isActive }} -->
                    <span class="badge" [class.bg-success]="item.isActive" [class.bg-secondary]="!item.isActive">
                      {{ item.isActive ? 'Active' : 'Inactive' }}
                    </span>
                  </td>
                  <td class="text-center" *ngIf="canEdit">
                    <span><i style="color: #4cdb4c" class="fa fa-edit" (click)="editThisUser(item)"></i></span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
