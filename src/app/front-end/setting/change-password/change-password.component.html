<div class="container-fluid">
  <div class="row">
    <div class="col-md-12">
      <div class="card mt-2">
        <div class="card-header">
          <h5>Change Password</h5>
        </div>
        <div class="card-body">
          <form class="theme-form" [formGroup]="change_pass">
            <div class="row">
              <div class="form-group col-sm-12 col-md-6">
                <label class="col-form-label pt-0" for="name">Username<sup class="astrik">*</sup></label>
                <input class="form-control" autocomplete="nofill" id="name" formControlName="username" type="text"
                  aria-describedby="nameHelp" placeholder="Enter Username" disabled />
              </div>
              <div class="form-group col-sm-12 col-md-6">
                <label class="col-form-label pt-0" for="currpassword">Current Password<sup
                    class="astrik">*</sup></label>
                <input class="form-control" autocomplete="nofill" id="currpassword" formControlName="current_password"
                  [type]="show ? 'text' : 'password'" aria-describedby="nameHelp" placeholder="Enter Current Password"
                  required />
                <div class="show-hide" (click)="showPassword()" *ngIf="!show">
                  <span class="show"></span>
                </div>
                <div class="show-hide" (click)="showPassword()" *ngIf="show">
                  <span class="Hide"></span>
                </div>
              </div>
              <div class="form-group col-sm-12 col-md-6">
                <label class="col-form-label pt-0" for="newpassword">New Password<sup class="astrik">*</sup></label>
                <input class="form-control" autocomplete="nofill" id="newpassword" formControlName="new_password"
                  [type]="show ? 'text' : 'password'" aria-describedby="nameHelp" placeholder="Enter New Password"
                  required />
                <div class="show-hide" (click)="showPassword()" *ngIf="!show">
                  <span class="show"></span>
                </div>
                <div class="show-hide" (click)="showPassword()" *ngIf="show">
                  <span class="Hide"></span>
                </div>
              </div>
              <div class="form-group col-sm-12 col-md-6">
                <label class="col-form-label pt-0" for="conpassword">Confirm Password<sup class="astrik">*</sup></label>
                <input class="form-control" autocomplete="nofill" id="conpassword" formControlName="confirm_password"
                  [type]="show ? 'text' : 'password'" aria-describedby="nameHelp" placeholder="Enter Confirm Password"
                  required />
                <div class="show-hide" (click)="showPassword()" *ngIf="!show">
                  <span class="show"></span>
                </div>
                <div class="show-hide" (click)="showPassword()" *ngIf="show">
                  <span class="Hide"></span>
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="card-footer">
          <button class="btn btn-primary mr-1" (click)="submit()" [disabled]="!change_pass.valid">
            Submit
          </button>
          <button class="btn btn-secondary" (click)="reset()">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>
